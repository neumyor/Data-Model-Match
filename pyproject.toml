[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-model-match"
version = "0.1.0"
description = "Match fields between data models with a real LLM."
requires-python = ">=3.9"

[project.scripts]
data-model-match = "datamodelmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
